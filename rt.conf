# Kconfig fragment for real-time measurements on hardware
#   west build -b esp32_devkitc/esp32/procpu -- "-DEXTRA_CONF_FILE=rt.conf"
# Combine with comm.conf;secrets.conf to measure under network load.

CONFIG_TRACING=y
CONFIG_TRACING_USER=y
CONFIG_FG_TRACE=y
CONFIG_FG_BENCH=y
CONFIG_FG_DIAG_STATS=y
