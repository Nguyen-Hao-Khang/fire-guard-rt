# Kconfig fragment for the Wokwi simulation build
#   west build -b esp32_devkitc/esp32/procpu -- "-DEXTRA_CONF_FILE=sim.conf"

# Wokwi photoresistor module: AO voltage rises when it gets darker
CONFIG_FG_LDR_INVERT=y

# Shorter MQ-2 warm-up so tests start quickly
CONFIG_FG_WARMUP_S=5

# Minimal logging maps LOG_* straight to printk and printk straight to the
# UART, so boot messages and fatal error dumps are printed even when the
# system halts before the log backends are initialised
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_PRINTK=n

# Detect thread stack overflows on context switch
CONFIG_STACK_SENTINEL=y

# Thread CPU usage and data flow report ("fg threads")
CONFIG_FG_DIAG_STATS=y

# Real-time analysis tools: timeline capture, load generators, benchmark
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
CONFIG_FG_TRACE=y
CONFIG_FG_BENCH=y
