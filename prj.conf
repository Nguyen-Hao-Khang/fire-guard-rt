# Kernel
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# Data channels
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y

# Peripherals
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_DHT=y
CONFIG_HC_SR04=y
CONFIG_LED=n

# Fault tolerance
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=8
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=200

# Diagnostics
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
# printk writes the same UART with poll_out; an interrupt-driven shell
# backend then loses its TX-done event and stops processing input
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
CONFIG_ASSERT=y
