# Kconfig fragment: Wi-Fi + MQTT (CoreIoT)
#   west build ... -- "-DEXTRA_CONF_FILE=comm.conf;secrets.conf"
# Requires: west blobs fetch hal_espressif ; single-core build (no SMP)

CONFIG_FG_COMM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_WIFI=y
CONFIG_ENTROPY_GENERATOR=y

# Network stack threads must be preemptible by the safety chain (NFR-02)
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
# Wi-Fi driver threads are created at "max priority" with FreeRTOS semantics;
# keep them below every safety thread (Zephyr: higher number = lower priority)
CONFIG_ESP32_WIFI_MAX_THREAD_PRIORITY=12

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60

CONFIG_HEAP_MEM_POOL_SIZE=16384
